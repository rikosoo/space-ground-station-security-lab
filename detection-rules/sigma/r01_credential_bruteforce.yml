title: Credential brute force followed by successful logon
id: 6f2c1a30-5b1e-4d54-9a4a-1c0f9b2d0a01
status: stable
description: >
  Five or more failed authentications against a single mission-control account
  within five minutes, followed by a success. In a ground segment the account
  set is small and known, so a burst of failures is never routine.
references:
  - https://sparta.aerospace.org/technique/REC-0005
  - https://attack.mitre.org/techniques/T1110/003/
author: space-ground-station-security-lab
date: 2026/01/15
tags:
  - attack.credential_access
  - attack.t1110.003
  - sparta.rec-0005
logsource:
  product: mission_control
  service: api.auth
detection:
  failures:
    event_type: auth.login
    outcome: failure
  success:
    event_type: auth.login
    outcome: success
  timeframe: 5m
  condition: failures | count(actor) >= 5 followed by success
falsepositives:
  - Operator password rotation immediately after several typed attempts
  - Automated console retrying a stale cached credential
level: high
fields:
  - actor
  - src_ip
  - attrs.asn
  - attrs.user_agent
