title: Critical telecommand by a principal with no such history
id: 6f2c1a30-5b1e-4d54-9a4a-1c0f9b2d0a04
status: experimental
description: >
  A command flagged critical in the flight catalogue (attitude, propulsion,
  power mode, key management) was issued by a principal that issued no critical
  command during the baseline window. Catches abuse of an entitled-but-unused
  privilege, which an allowlist alone cannot see.
references:
  - https://sparta.aerospace.org/technique/EX-0009
author: space-ground-station-security-lab
date: 2026/01/15
tags:
  - attack.execution
  - sparta.ex-0009
logsource:
  product: mission_control
  service: api.command
detection:
  selection:
    event_type: command.submit
    attrs.critical: true
  filter_known:
    actor: '%baseline_critical_command_principals%'
  condition: selection and not filter_known
falsepositives:
  - A newly qualified flight controller performing their first manoeuvre;
    expect one alert per operator per qualification and close it as expected
level: high
fields:
  - actor
  - attrs.role
  - attrs.command
  - attrs.session_age_s
